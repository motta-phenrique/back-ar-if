version: "3.8"

services: 
  postgres:
    container_name: ar-if
    image: postgres
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: nest-clean
      PGDATA: /data/postgres
    ports:
      - "5434:5432"
    volumes:
      - ./data/pg:/data/postgres

  redis:
    container_name: nest-redis
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  mosquitto:
    container_name: nest-mosquitto
    image: eclipse-mosquitto:2
    # Config embutida na imagem: escuta em 1883 e aceita conexão anônima. Só para dev.
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"
